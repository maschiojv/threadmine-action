name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run test/
      - run: npm run build
      - name: dist/ is committed and up to date
        run: |
          if ! git diff --quiet dist/; then
            git diff --stat dist/
            git diff dist/ | head -80
            echo "::error::dist/ is stale: run npm run build and commit dist/"
            exit 1
          fi
